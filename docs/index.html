<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Skybound – 3D Platformer</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Three.js renderer mounts here -->
    <div id="game-container"></div>

    <!-- HUD overlay -->
    <div id="hud">
      <span id="score-display">Score: 0</span>
    </div>

    <!-- On-screen jump button (mobile) -->
    <button id="jump-btn" aria-label="Jump">JUMP</button>

    <!-- Virtual joystick zone (mobile) -->
    <div id="joystick-zone">
      <div id="joystick-base">
        <div id="joystick-thumb"></div>
      </div>
    </div>

    <!-- Fullscreen overlay screens -->
    <div id="overlay" class="hidden">
      <div id="overlay-box">
        <h1 id="overlay-title"></h1>
        <p id="overlay-msg"></p>
        <button id="restart-btn">Restart</button>
      </div>
    </div>

    <!-- Three.js via CDN (ES module build) -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js"
      }
    }
    </script>

    <!-- Game modules -->
    <script type="module" src="./main.js"></script>
  </body>
</html>
